services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tigre_fight}
      POSTGRES_USER: ${POSTGRES_USER:-tigre_fight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - tigre_fight_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tigre_fight} -d ${POSTGRES_DB:-tigre_fight}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tigre_fight_postgres:
